<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Mismatch-Guided Residual Cleanup</title>
  <desc id="desc">A compact SATD diagram with source and target RGB inputs, parsing-derived hair masks, four gated residual heads, a protection branch, StyleGAN2 decoding, and a clean RGB result.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#344054"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4f759b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4f8060"/>
    </marker>
    <clipPath id="sourceClip"><rect x="23" y="74" width="64" height="64" rx="3"/></clipPath>
    <clipPath id="targetClip"><rect x="103" y="74" width="64" height="64" rx="3"/></clipPath>
    <clipPath id="resultClip"><rect x="1210" y="303" width="70" height="76" rx="3"/></clipPath>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #17202d; }
      .head { font: 700 15px Arial, sans-serif; fill: #202939; }
      .body { font: 13px Arial, sans-serif; fill: #344054; }
      .small { font: 11.5px Arial, sans-serif; fill: #344054; }
      .tiny { font: 10.5px Arial, sans-serif; fill: #475467; }
      .layer { font: 10.5px Arial, sans-serif; fill: #344054; }
      .microhead { font: 700 10.5px Arial, sans-serif; fill: #202939; }
      .math { font-family: "Cambria Math", Cambria, "Times New Roman", serif; font-size: 15px; font-style: italic; font-weight: 700; fill: #202939; }
      .mathsmall { font-family: "Cambria Math", Cambria, "Times New Roman", serif; font-size: 13px; font-style: italic; font-weight: 700; fill: #202939; }
      .flow { fill: none; stroke: #344054; stroke-width: 1.8; marker-end: url(#arrow); }
      .blueflow { fill: none; stroke: #4f759b; stroke-width: 1.65; marker-end: url(#arrowBlue); }
      .guide { fill: none; stroke: #4f759b; stroke-width: 1.35; stroke-dasharray: 5 4; marker-end: url(#arrowBlue); }
      .greenflow { fill: none; stroke: #4f8060; stroke-width: 1.8; marker-end: url(#arrowGreen); }
      .skip { fill: none; stroke: #596579; stroke-width: 1.55; marker-end: url(#arrow); }
      .line { fill: none; stroke: #667085; stroke-width: 1.6; }
      .tensor .back { fill: currentColor; fill-opacity: .22; stroke: currentColor; stroke-width: 1; }
      .tensor .mid { fill: currentColor; fill-opacity: .45; stroke: currentColor; stroke-width: 1; }
      .tensor .front { fill: currentColor; fill-opacity: .78; stroke: currentColor; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="8" y="8" width="1284" height="544" rx="8" fill="#fff" stroke="#d6dce5" stroke-width="1.4"/>
  <text x="650" y="34" text-anchor="middle" class="title">Mismatch-Guided Residual Cleanup (SATD)</text>
  <line x1="26" y1="49" x2="1274" y2="49" stroke="#d6dce5" stroke-width="1.1"/>

  <!-- Compact visual inputs occupy the original left context column. -->
  <text x="55" y="68" text-anchor="middle" class="small">Source RGB</text>
  <image x="23" y="74" width="64" height="64" preserveAspectRatio="xMidYMid slice"
         href="v8_rgb_source.png" xlink:href="v8_rgb_source.png" clip-path="url(#sourceClip)"/>
  <rect x="23" y="74" width="64" height="64" rx="3" fill="none" stroke="#4f759b" stroke-width="1.2"/>

  <text x="135" y="68" text-anchor="middle" class="small">Target RGB</text>
  <image x="103" y="74" width="64" height="64" preserveAspectRatio="xMidYMid slice"
         href="v8_rgb_target.png" xlink:href="v8_rgb_target.png" clip-path="url(#targetClip)"/>
  <rect x="103" y="74" width="64" height="64" rx="3" fill="none" stroke="#4f759b" stroke-width="1.2"/>

  <!-- Source RGB also enters the SATD shadow/detail context directly. -->
  <path d="M23 106 H15 V302 H23" class="flow"/>

  <path d="M55 138 V145 H78 V150" class="blueflow"/>
  <path d="M135 138 V145 H112 V150" class="blueflow"/>
  <rect x="48" y="151" width="94" height="29" rx="4" fill="#eef5fb" stroke="#4f759b" stroke-width="1.2"/>
  <text x="95" y="170" text-anchor="middle" class="small">Face Parsing</text>

  <path d="M95 180 V188 H64 V194" class="blueflow"/>
  <path d="M95 188 H123 V194" class="blueflow"/>
  <rect x="44" y="195" width="40" height="40" rx="2" fill="#101828" stroke="#4f759b"/>
  <path d="M50 230 C50 209 55 200 64 199 C74 200 79 210 78 230 L71 230 C72 217 70 207 64 204 C57 208 57 219 58 230 Z" fill="#fff"/>
  <rect x="103" y="195" width="40" height="40" rx="2" fill="#101828" stroke="#4f759b"/>
  <path d="M108 228 C108 210 114 201 123 200 C133 201 139 210 138 227 C134 222 131 214 123 210 C116 214 113 221 112 229 Z" fill="#fff"/>
  <text x="94" y="250" text-anchor="middle" class="small">Hair Masks</text>

  <path d="M64 235 V258 H94 V270" class="blueflow"/>
  <path d="M123 235 V258 H96 V270" class="blueflow"/>
  <rect x="25" y="272" width="140" height="60" rx="5" fill="#eef5fb" stroke="#4f759b" stroke-width="1.3"/>
  <text x="95" y="292" text-anchor="middle" class="head">Mismatch Context <tspan font-family="Cambria Math" font-style="italic">C<tspan baseline-shift="sub" font-size="9">i</tspan></tspan></text>
  <text x="95" y="311" text-anchor="middle" class="mathsmall">F<tspan baseline-shift="sub" font-size="8">base</tspan>, F<tspan baseline-shift="sub" font-size="8">src</tspan>, F<tspan baseline-shift="sub" font-size="8">src-inp</tspan></text>
  <text x="95" y="327" text-anchor="middle" class="mathsmall">I<tspan baseline-shift="sub" font-size="8">src</tspan>, M<tspan baseline-shift="sub" font-size="8">&#916;</tspan></text>

  <!-- A thin prior bus runs above the core rather than adding another horizontal module. -->
  <path d="M165 286 H171 V60 H808 V73" class="guide"/>
  <path d="M165 302 H173 V207 H183" class="flow"/>

  <!-- One expanded topology denotes four region-specific residual heads. -->
  <rect x="180" y="73" width="495" height="293" rx="7" fill="#fffaf5" stroke="#c98243" stroke-width="1.5"/>
  <text x="427.5" y="99" text-anchor="middle" class="head">Gated Residual Head &#215;4</text>
  <text x="427.5" y="116" text-anchor="middle" class="small">Halo | Tail | Neck | Copy</text>

  <g class="tensor" style="color:#738397">
    <rect class="back" x="211" y="162" width="39" height="66"/>
    <rect class="mid" x="205" y="168" width="39" height="66"/>
    <rect class="front" x="199" y="174" width="39" height="66"/>
  </g>
  <text x="218" y="263" text-anchor="middle" class="math">C<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <path d="M250 207 H301" class="flow"/>
  <text x="276" y="182" text-anchor="middle" class="small">3&#215;3 Conv</text>

  <g class="tensor" style="color:#d49152">
    <rect class="back" x="320" y="162" width="42" height="66"/>
    <rect class="mid" x="314" y="168" width="42" height="66"/>
    <rect class="front" x="308" y="174" width="42" height="66"/>
  </g>
  <text x="331" y="263" text-anchor="middle" class="head">256</text>
  <path d="M362 207 H403" class="flow"/>
  <text x="383" y="182" text-anchor="middle" class="small">3&#215;3 Conv</text>

  <g class="tensor" style="color:#c98243">
    <rect class="back" x="422" y="162" width="42" height="66"/>
    <rect class="mid" x="416" y="168" width="42" height="66"/>
    <rect class="front" x="410" y="174" width="42" height="66"/>
  </g>
  <text x="433" y="263" text-anchor="middle" class="head">128</text>

  <path d="M464 207 H487 V133 H521" class="flow"/>
  <text x="504" y="151" text-anchor="middle" class="layer">1&#215;1</text>
  <g style="color:#4f8060">
    <polygon points="529,108 537,101 568,101 560,108" fill="currentColor" fill-opacity=".16" stroke="currentColor"/>
    <rect x="529" y="108" width="31" height="49" fill="currentColor" fill-opacity=".30" stroke="currentColor"/>
  </g>
  <text x="580" y="128" class="math">G<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <text x="580" y="147" class="mathsmall">&#963;</text>

  <path d="M464 207 H487 V286 H521" class="flow"/>
  <text x="504" y="273" text-anchor="middle" class="layer">1&#215;1 Conv</text>
  <g class="tensor" style="color:#c98243">
    <rect class="back" x="539" y="252" width="38" height="64"/>
    <rect class="mid" x="533" y="258" width="38" height="64"/>
    <rect class="front" x="527" y="264" width="38" height="64"/>
  </g>
  <text x="585" y="284" class="math">&#916;F<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <text x="585" y="303" class="small">512</text>

  <path d="M560 133 H646 M577 286 H646 M646 133 V286" class="line"/>
  <path d="M646 209 H718" class="flow"/>

  <!-- Region fusion uses mask-derived support without a separate wide stage. -->
  <rect x="730" y="74" width="160" height="45" rx="5" fill="#fff7f6" stroke="#c96561" stroke-width="1.25"/>
  <text x="810" y="94" text-anchor="middle" class="head">Region Priors</text>
  <text x="810" y="112" text-anchor="middle" class="math">R<tspan baseline-shift="sub" font-size="9">i</tspan>, M<tspan baseline-shift="sub" font-size="9">s</tspan></text>
  <path d="M810 119 V140" class="flow"/>

  <rect x="722" y="145" width="180" height="126" rx="6" fill="#fff" stroke="#c98243" stroke-width="1.45"/>
  <text x="812" y="171" text-anchor="middle" class="head">Residual Fusion</text>
  <text x="812" y="194" text-anchor="middle" class="small">Region Priors +</text>
  <text x="812" y="213" text-anchor="middle" class="small">Gated Residuals</text>
  <line x1="744" y1="224" x2="880" y2="224" stroke="#e6c5a6"/>
  <text x="812" y="250" text-anchor="middle" class="math">&#916;F<tspan baseline-shift="sub" font-size="9">cleanup</tspan></text>
  <path d="M902 208 H923" class="flow"/>

  <g class="tensor" style="color:#c98243">
    <rect class="back" x="946" y="174" width="37" height="67"/>
    <rect class="mid" x="941" y="179" width="37" height="67"/>
    <rect class="front" x="936" y="184" width="37" height="67"/>
  </g>
  <text x="955" y="267" text-anchor="middle" class="small">512</text>

  <!-- Protect context originates from the same feature/mask inputs. -->
  <path d="M95 332 V443 H172" class="flow"/>
  <rect x="175" y="417" width="142" height="53" rx="5" fill="#eef5fb" stroke="#4f759b" stroke-width="1.25"/>
  <text x="246" y="439" text-anchor="middle" class="head">Protect Context <tspan font-family="Cambria Math" font-style="italic">C<tspan baseline-shift="sub" font-size="9">p</tspan></tspan></text>
  <text x="246" y="462" text-anchor="middle" class="mathsmall">P<tspan baseline-shift="sub" font-size="8">base</tspan>, P<tspan baseline-shift="sub" font-size="8">src</tspan>, F<tspan baseline-shift="sub" font-size="8">mask</tspan></text>
  <path d="M317 443 H337" class="flow"/>

  <rect x="340" y="385" width="280" height="128" rx="6" fill="#f7fbf8" stroke="#4f8060" stroke-width="1.45"/>
  <text x="480" y="411" text-anchor="middle" class="head">Protect Head</text>
  <g transform="translate(359,429)">
    <rect x="0" y="0" width="66" height="39" rx="4" fill="#e4efe7" stroke="#4f8060"/>
    <text x="33" y="16" text-anchor="middle" class="layer">3&#215;3 Conv</text>
    <text x="33" y="31" text-anchor="middle" class="layer">320&#8594;128</text>
    <path d="M66 19 H78" class="greenflow"/>
    <rect x="83" y="0" width="66" height="39" rx="4" fill="#d5e7da" stroke="#4f8060"/>
    <text x="116" y="16" text-anchor="middle" class="layer">3&#215;3 Conv</text>
    <text x="116" y="31" text-anchor="middle" class="layer">128&#8594;64</text>
    <path d="M149 19 H161" class="greenflow"/>
    <rect x="166" y="0" width="66" height="39" rx="4" fill="#c6dfcd" stroke="#4f8060"/>
    <text x="199" y="16" text-anchor="middle" class="layer">1&#215;1 Conv</text>
    <text x="199" y="31" text-anchor="middle" class="layer">64&#8594;1, &#963;</text>
  </g>
  <path d="M620 443 H638" class="greenflow"/>

  <g style="color:#4f8060">
    <polygon points="646,416 654,409 680,409 672,416" fill="currentColor" fill-opacity=".16" stroke="currentColor"/>
    <rect x="646" y="416" width="26" height="52" fill="currentColor" fill-opacity=".30" stroke="currentColor"/>
  </g>
  <text x="659" y="488" text-anchor="middle" class="math">G<tspan baseline-shift="sub" font-size="9">p</tspan></text>
  <path d="M672 443 H718" class="greenflow"/>

  <rect x="690" y="486" width="126" height="40" rx="5" fill="#fff7f6" stroke="#c96561" stroke-width="1.25"/>
  <text x="753" y="503" text-anchor="middle" class="head">Protect Prior</text>
  <text x="753" y="519" text-anchor="middle" class="math">R<tspan baseline-shift="sub" font-size="9">p</tspan></text>
  <path d="M753 486 V466" class="greenflow"/>
  <circle cx="753" cy="443" r="21" fill="#fff" stroke="#4f8060" stroke-width="1.7"/>
  <text x="753" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344054">&#215;</text>
  <path d="M774 443 H794" class="greenflow"/>

  <g style="color:#4f8060">
    <polygon points="802,417 810,410 836,410 828,417" fill="currentColor" fill-opacity=".16" stroke="currentColor"/>
    <rect x="802" y="417" width="26" height="52" fill="currentColor" fill-opacity=".30" stroke="currentColor"/>
  </g>
  <text x="815" y="489" text-anchor="middle" class="math">P</text>

  <!-- Residual update is compressed to leave room for a real decoded result. -->
  <path d="M973 208 H995 V319" class="flow"/>
  <path d="M828 443 H955 V343 H973" class="greenflow"/>
  <text x="900" y="334" text-anchor="middle" class="math">&#945;M<tspan baseline-shift="sub" font-size="9">s</tspan> &#x2299; (1 - 0.85P)</text>
  <circle cx="995" cy="343" r="21" fill="#fff" stroke="#4f8060" stroke-width="1.7"/>
  <text x="995" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344054">&#215;</text>
  <path d="M1016 343 H1043" class="flow"/>
  <circle cx="1065" cy="343" r="21" fill="#fff" stroke="#344054" stroke-width="1.7"/>
  <text x="1065" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#344054">+</text>

  <path d="M95 332 V536 H1065 V365" class="skip"/>
  <text x="956" y="529" text-anchor="middle" class="mathsmall">F<tspan baseline-shift="sub" font-size="8">base</tspan> skip</text>

  <path d="M1086 343 H1094" class="greenflow"/>
  <g class="tensor" style="color:#4f8060">
    <rect class="back" x="1112" y="311" width="31" height="60"/>
    <rect class="mid" x="1107" y="316" width="31" height="60"/>
    <rect class="front" x="1102" y="321" width="31" height="60"/>
  </g>
  <text x="1121" y="405" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="9">clean</tspan></text>

  <path d="M1143 343 H1146" class="greenflow"/>
  <rect x="1148" y="314" width="54" height="61" rx="4" fill="#f2f4f7" stroke="#596579" stroke-width="1.2"/>
  <text x="1175" y="338" text-anchor="middle" class="microhead">StyleGAN2</text>
  <text x="1175" y="358" text-anchor="middle" class="microhead">Decoder</text>
  <path d="M1202 343 H1207" class="greenflow"/>

  <text x="1245" y="294" text-anchor="middle" class="head">Clean Result</text>
  <image x="1210" y="303" width="70" height="76" preserveAspectRatio="xMidYMid slice"
         href="v8_rgb_clean.png" xlink:href="v8_rgb_clean.png" clip-path="url(#resultClip)"/>
  <rect x="1210" y="303" width="70" height="76" rx="3" fill="none" stroke="#4f8060" stroke-width="1.4"/>
</svg>
