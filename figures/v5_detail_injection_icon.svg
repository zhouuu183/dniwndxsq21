<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="65" viewBox="0 0 240 65" role="img" aria-labelledby="title desc">
  <title id="title">Detail Injection</title>
  <desc id="desc">Orange convolutional blocks inject detail into an output feature tensor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c96518"/>
    </marker>
  </defs>

  <!-- Detail convolution blocks -->
  <g stroke="#bb5d18" stroke-width="1.15" stroke-linejoin="round">
    <rect x="5" y="17" width="15" height="42" fill="#f6bd8b"/>
    <polygon points="5,17 13,9 28,9 20,17" fill="#ffe1c5"/>
    <polygon points="20,17 28,9 28,51 20,59" fill="#e89250"/>

    <rect x="38" y="21" width="15" height="38" fill="#f5b77f"/>
    <polygon points="38,21 46,13 61,13 53,21" fill="#ffddbd"/>
    <polygon points="53,21 61,13 61,51 53,59" fill="#e58a45"/>

    <rect x="76" y="27" width="12" height="32" fill="#f2ae73"/>
    <polygon points="76,27 83,20 95,20 88,27" fill="#ffd9b5"/>
    <polygon points="88,27 95,20 95,52 88,59" fill="#dd7f38"/>
  </g>

  <g fill="#b95a17">
    <circle cx="108" cy="43" r="1.8"/>
    <circle cx="117" cy="43" r="1.8"/>
    <circle cx="126" cy="43" r="1.8"/>
  </g>

  <!-- Final injection layer -->
  <g stroke="#bb5d18" stroke-width="1.15" stroke-linejoin="round">
    <rect x="138" y="30" width="9" height="29" fill="#f2aa6d"/>
    <polygon points="138,30 144,24 153,24 147,30" fill="#ffd6b0"/>
    <polygon points="147,30 153,24 153,53 147,59" fill="#dc7a33"/>
  </g>

  <path d="M159 42 H181" fill="none" stroke="#c96518" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Injected feature tensor -->
  <g stroke="#bb5d18" stroke-width="1.15" stroke-linejoin="round">
    <rect x="190" y="17" width="37" height="40" fill="#f4c49b"/>
    <polygon points="190,17 199,8 236,8 227,17" fill="#ffe3ca"/>
    <polygon points="227,17 236,8 236,48 227,57" fill="#e89856"/>
    <path d="M202.3 17V57M214.7 17V57M190 30.3H227M190 43.7H227" fill="none" stroke="#d47a36" stroke-width="0.8"/>
    <path d="M202.3 17 211.3 8M214.7 17 223.7 8M227 30.3 236 21.3M227 43.7 236 34.7" fill="none" stroke="#d47a36" stroke-width="0.8"/>
  </g>
</svg>
