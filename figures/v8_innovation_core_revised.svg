<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">Mismatch-Guided Gated Residual Cleanup</title>
  <desc id="desc">Source and target hair masks form mismatch guidance for lightweight region residual heads and a protection head, producing a localized clean feature for StyleGAN2.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 Z" fill="#568665"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 Z" fill="#b65f5b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17202d; }
      .head { font: 700 17px Arial, sans-serif; fill: #202939; }
      .body { font: 14px Arial, sans-serif; fill: #344054; }
      .small { font: 12.5px Arial, sans-serif; fill: #475467; }
      .tiny { font: 11px Arial, sans-serif; fill: #667085; }
      .math { font: italic 700 17px Georgia, serif; fill: #202939; }
      .flow { fill: none; stroke: #344054; stroke-width: 1.9; marker-end: url(#arrow); }
      .greenflow { fill: none; stroke: #568665; stroke-width: 1.9; marker-end: url(#arrowGreen); }
      .redflow { fill: none; stroke: #b65f5b; stroke-width: 1.7; marker-end: url(#arrowRed); }
      .guide { fill: none; stroke: #8b98a9; stroke-width: 1.5; }
      .tensor .back { fill: currentColor; fill-opacity: .22; stroke: currentColor; stroke-width: 1.1; }
      .tensor .mid { fill: currentColor; fill-opacity: .45; stroke: currentColor; stroke-width: 1.1; }
      .tensor .front { fill: currentColor; fill-opacity: .78; stroke: currentColor; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="8" y="8" width="1584" height="644" rx="9" fill="#fff" stroke="#d6dce5" stroke-width="1.4"/>
  <text x="800" y="39" text-anchor="middle" class="title">Mismatch-Guided Gated Residual Cleanup</text>
  <line x1="28" y1="62" x2="1572" y2="62" stroke="#d6dce5" stroke-width="1.1"/>

  <!-- Structural mismatch guidance. -->
  <rect x="25" y="92" width="220" height="235" rx="8" fill="#fbfdff" stroke="#5b83aa" stroke-width="1.4"/>
  <text x="135" y="119" text-anchor="middle" class="head">Structural Difference</text>

  <g>
    <rect x="47" y="137" width="60" height="62" rx="3" fill="#111827" stroke="#5b83aa" stroke-width="1.1"/>
    <path d="M58 188 C56 169 60 148 77 144 C94 148 99 166 96 190 L86 190 C87 174 87 158 77 154 C67 158 68 175 68 190 Z" fill="#fff"/>
    <rect x="157" y="137" width="60" height="62" rx="3" fill="#111827" stroke="#5b83aa" stroke-width="1.1"/>
    <path d="M164 189 C165 154 176 145 187 144 C200 145 210 156 211 189 L202 189 C202 173 200 159 188 154 C178 159 177 174 178 189 Z" fill="#fff"/>
    <path d="M169 168 C164 176 163 184 164 193" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="77" y="217" text-anchor="middle" class="tiny">Source Hair</text>
    <text x="187" y="217" text-anchor="middle" class="tiny">Target Hair</text>
  </g>

  <path d="M77 199 V226 H124 V237" class="flow"/>
  <path d="M187 199 V226 H146 V237" class="flow"/>
  <rect x="55" y="240" width="160" height="55" rx="6" fill="#eef5fb" stroke="#5b83aa" stroke-width="1.3"/>
  <text x="135" y="263" text-anchor="middle" class="head">Mismatch Masks</text>
  <text x="135" y="285" text-anchor="middle" class="math">M<tspan baseline-shift="sub" font-size="10">&#916;</tspan></text>

  <!-- Mismatch and shadow context. -->
  <path d="M215 267 H252 V223 H270" class="flow"/>
  <rect x="270" y="190" width="155" height="67" rx="6" fill="#f7fbff" stroke="#5b83aa" stroke-width="1.3"/>
  <text x="347.5" y="214" text-anchor="middle" class="head">Mismatch Context</text>
  <text x="347.5" y="235" text-anchor="middle" class="math">C<tspan baseline-shift="sub" font-size="10">i</tspan></text>
  <text x="347.5" y="251" text-anchor="middle" class="tiny">features + masks + shadow</text>
  <path d="M425 223 H462" class="flow"/>

  <!-- Region priors and final support are derived from mismatch masks. -->
  <path d="M215 267 H254 V78 H1110 V88" class="redflow"/>
  <rect x="1015" y="88" width="190" height="72" rx="6" fill="#fff7f6" stroke="#cf6c67" stroke-width="1.35"/>
  <text x="1110" y="111" text-anchor="middle" class="head">Region Priors</text>
  <text x="1110" y="133" text-anchor="middle" class="math">R<tspan baseline-shift="sub" font-size="10">i</tspan>, M<tspan baseline-shift="sub" font-size="10">s</tspan></text>
  <text x="1110" y="151" text-anchor="middle" class="tiny">shadow + face + region support</text>

  <!-- Four lightweight region-specific residual heads. -->
  <rect x="445" y="92" width="525" height="330" rx="8" fill="#fffdfb" stroke="#cf8b4e" stroke-width="1.55"/>
  <text x="707.5" y="120" text-anchor="middle" class="head">Lightweight Gated Residual Heads &#215;4</text>
  <text x="707.5" y="143" text-anchor="middle" class="small">Halo | Hair Tail | Neck | Texture</text>

  <g class="tensor" style="color:#6e7f92">
    <rect class="back" x="492" y="178" width="38" height="72"/>
    <rect class="mid" x="486" y="184" width="38" height="72"/>
    <rect class="front" x="480" y="190" width="38" height="72"/>
  </g>
  <text x="499" y="286" text-anchor="middle" class="math">C<tspan baseline-shift="sub" font-size="10">i</tspan></text>

  <path d="M530 226 H574" class="flow"/>
  <text x="552" y="199" text-anchor="middle" class="small">3&#215;3 Conv</text>
  <text x="552" y="216" text-anchor="middle" class="tiny">GN + SiLU</text>
  <g class="tensor" style="color:#d49152">
    <rect class="back" x="602" y="178" width="42" height="72"/>
    <rect class="mid" x="596" y="184" width="42" height="72"/>
    <rect class="front" x="590" y="190" width="42" height="72"/>
  </g>
  <text x="611" y="286" text-anchor="middle" class="head">256</text>

  <path d="M644 226 H689" class="flow"/>
  <text x="666" y="199" text-anchor="middle" class="small">3&#215;3 Conv</text>
  <text x="666" y="216" text-anchor="middle" class="tiny">GN + SiLU</text>
  <g class="tensor" style="color:#c98243">
    <rect class="back" x="717" y="178" width="42" height="72"/>
    <rect class="mid" x="711" y="184" width="42" height="72"/>
    <rect class="front" x="705" y="190" width="42" height="72"/>
  </g>
  <text x="726" y="286" text-anchor="middle" class="head">128</text>

  <path d="M759 226 H790 V164 H825" class="flow"/>
  <text x="803" y="151" text-anchor="middle" class="tiny">1&#215;1 Conv</text>
  <g style="color:#568665">
    <polygon points="838,141 846,134 872,134 864,141" fill="currentColor" fill-opacity=".15" stroke="currentColor"/>
    <rect x="838" y="141" width="26" height="52" fill="currentColor" fill-opacity=".30" stroke="currentColor" stroke-width="1.2"/>
  </g>
  <text x="883" y="161" class="math">G<tspan baseline-shift="sub" font-size="10">i</tspan></text>
  <text x="883" y="181" class="tiny">Sigmoid</text>

  <path d="M759 226 H790 V310 H825" class="flow"/>
  <text x="803" y="296" text-anchor="middle" class="tiny">1&#215;1 Conv</text>
  <g class="tensor" style="color:#c98243">
    <rect class="back" x="842" y="276" width="38" height="65"/>
    <rect class="mid" x="836" y="282" width="38" height="65"/>
    <rect class="front" x="830" y="288" width="38" height="65"/>
  </g>
  <text x="889" y="313" class="math">&#916;F<tspan baseline-shift="sub" font-size="10">i</tspan></text>
  <text x="889" y="333" class="tiny">512 ch</text>

  <path d="M864 166 H942 V214 H990" class="flow"/>
  <path d="M880 310 H942 V278 H990" class="flow"/>
  <text x="707.5" y="397" text-anchor="middle" class="tiny">Same topology, separate parameters for four localized corrections</text>

  <!-- Code-faithful gated residual fusion. -->
  <path d="M1110 160 V175" class="redflow"/>
  <rect x="1000" y="175" width="220" height="160" rx="7" fill="#fff" stroke="#cf8b4e" stroke-width="1.55"/>
  <text x="1110" y="203" text-anchor="middle" class="head">Gated Residual Fusion</text>
  <text x="1110" y="232" text-anchor="middle" class="math">&#931;<tspan baseline-shift="sub" font-size="10">i</tspan> &#955;<tspan baseline-shift="sub" font-size="10">i</tspan> G<tspan baseline-shift="sub" font-size="10">i</tspan> &#x2299; R<tspan baseline-shift="sub" font-size="10">i</tspan> &#x2299; &#916;F<tspan baseline-shift="sub" font-size="10">i</tspan></text>
  <text x="1110" y="258" text-anchor="middle" class="small">+ shadow / face priors</text>
  <text x="1110" y="302" text-anchor="middle" class="math">&#916;F<tspan baseline-shift="sub" font-size="10">cleanup</tspan></text>

  <path d="M1220 255 H1237" class="flow"/>
  <g class="tensor" style="color:#c98243">
    <rect class="back" x="1257" y="215" width="38" height="72"/>
    <rect class="mid" x="1251" y="221" width="38" height="72"/>
    <rect class="front" x="1245" y="227" width="38" height="72"/>
  </g>
  <text x="1264" y="320" text-anchor="middle" class="tiny">512 ch</text>

  <!-- Protection branch. -->
  <path d="M215 267 H252 V527 H270" class="flow"/>
  <rect x="270" y="494" width="155" height="67" rx="6" fill="#f7fbff" stroke="#5b83aa" stroke-width="1.3"/>
  <text x="347.5" y="518" text-anchor="middle" class="head">Protect Context</text>
  <text x="347.5" y="540" text-anchor="middle" class="math">C<tspan baseline-shift="sub" font-size="10">p</tspan></text>
  <text x="347.5" y="556" text-anchor="middle" class="tiny">features + masks</text>
  <path d="M425 527 H445" class="flow"/>

  <rect x="445" y="455" width="525" height="155" rx="8" fill="#fff" stroke="#568665" stroke-width="1.55"/>
  <text x="707.5" y="482" text-anchor="middle" class="head">Protect Head</text>

  <g>
    <rect x="470" y="505" width="100" height="45" rx="5" fill="#e4efe7" stroke="#568665"/>
    <text x="520" y="523" text-anchor="middle" class="tiny">3&#215;3 Conv</text>
    <text x="520" y="541" text-anchor="middle" class="tiny">320 &#8594; 128</text>
    <path d="M570 527 H588" class="greenflow"/>

    <rect x="595" y="505" width="100" height="45" rx="5" fill="#d5e7da" stroke="#568665"/>
    <text x="645" y="523" text-anchor="middle" class="tiny">3&#215;3 Conv</text>
    <text x="645" y="541" text-anchor="middle" class="tiny">128 &#8594; 64</text>
    <path d="M695 527 H713" class="greenflow"/>

    <rect x="720" y="505" width="100" height="45" rx="5" fill="#c6dfcd" stroke="#568665"/>
    <text x="770" y="523" text-anchor="middle" class="tiny">1&#215;1 Conv</text>
    <text x="770" y="541" text-anchor="middle" class="tiny">64 &#8594; 1</text>
    <path d="M820 527 H865" class="greenflow"/>
    <text x="842" y="514" text-anchor="middle" class="tiny">Sigmoid</text>

    <g style="color:#568665">
      <polygon points="878,501 886,494 912,494 904,501" fill="currentColor" fill-opacity=".15" stroke="currentColor"/>
      <rect x="878" y="501" width="26" height="52" fill="currentColor" fill-opacity=".30" stroke="currentColor" stroke-width="1.2"/>
    </g>
    <text x="891" y="577" text-anchor="middle" class="math">G<tspan baseline-shift="sub" font-size="10">p</tspan></text>
  </g>

  <path d="M904 527 H1016" class="greenflow"/>
  <circle cx="1040" cy="527" r="22" fill="#fff" stroke="#568665" stroke-width="1.8"/>
  <text x="1040" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344054">&#215;</text>

  <rect x="970" y="580" width="140" height="48" rx="6" fill="#fff7f6" stroke="#cf6c67" stroke-width="1.3"/>
  <text x="1040" y="599" text-anchor="middle" class="head">Protect Prior</text>
  <text x="1040" y="619" text-anchor="middle" class="math">R<tspan baseline-shift="sub" font-size="10">p</tspan></text>
  <path d="M1040 580 V551" class="greenflow"/>

  <path d="M1062 527 H1085" class="greenflow"/>
  <g style="color:#568665">
    <polygon points="1098,501 1106,494 1132,494 1124,501" fill="currentColor" fill-opacity=".15" stroke="currentColor"/>
    <rect x="1098" y="501" width="26" height="52" fill="currentColor" fill-opacity=".30" stroke="currentColor" stroke-width="1.2"/>
  </g>
  <text x="1111" y="577" text-anchor="middle" class="math">P</text>

  <!-- Localized protected update. -->
  <path d="M1205 124 H1312 V470" class="redflow"/>
  <path d="M1124 527 H1200" class="greenflow"/>
  <rect x="1200" y="470" width="205" height="72" rx="7" fill="#f8fbf9" stroke="#568665" stroke-width="1.45"/>
  <text x="1302.5" y="495" text-anchor="middle" class="head">Localized Gate</text>
  <text x="1302.5" y="523" text-anchor="middle" class="math">&#945; M<tspan baseline-shift="sub" font-size="10">s</tspan> &#x2299; (1 - 0.85P)</text>

  <path d="M1283 263 H1360 V336" class="flow"/>
  <path d="M1302 470 V407 H1338 V360" class="greenflow"/>
  <circle cx="1360" cy="360" r="22" fill="#fff" stroke="#568665" stroke-width="1.8"/>
  <text x="1360" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344054">&#215;</text>

  <path d="M1382 360 H1418" class="flow"/>
  <circle cx="1440" cy="360" r="22" fill="#fff" stroke="#344054" stroke-width="1.8"/>
  <text x="1440" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#344054">+</text>

  <rect x="1365" y="580" width="150" height="57" rx="6" fill="#f7fbff" stroke="#5b83aa" stroke-width="1.3"/>
  <text x="1440" y="603" text-anchor="middle" class="head">Base Feature</text>
  <text x="1440" y="625" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="10">base</tspan></text>
  <path d="M1440 580 V383" class="flow"/>

  <path d="M1462 360 H1498" class="greenflow"/>
  <g class="tensor" style="color:#568665">
    <rect class="back" x="1527" y="318" width="38" height="75"/>
    <rect class="mid" x="1521" y="324" width="38" height="75"/>
    <rect class="front" x="1515" y="330" width="38" height="75"/>
  </g>
  <text x="1534" y="431" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="10">clean</tspan></text>
  <path d="M1534 438 V460" class="greenflow"/>
  <text x="1534" y="482" text-anchor="middle" class="small">to StyleGAN2</text>
</svg>
